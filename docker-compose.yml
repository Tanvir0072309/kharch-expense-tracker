services:
  # ========================================
  # PRIMARY POSTGRES INSTANCES (Shards) - NO CHANGE
  # ========================================
  
  postgres-1:
    image: postgres:18
    container_name: kharch-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: kharch
      POSTGRES_USER: kharch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5433:5432"
    volumes:
      - postgres_1_data:/var/lib/postgresql
      - ./infrastructure/postgres/replication/shard-1/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/replication/shard-1/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharch_user -d kharch"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-2:
    image: postgres:18
    container_name: kharch-postgres-2
    restart: unless-stopped
    environment:
      POSTGRES_DB: kharch
      POSTGRES_USER: kharch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5434:5432"
    volumes:
      - postgres_2_data:/var/lib/postgresql
      - ./infrastructure/postgres/replication/shard-2/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/replication/shard-2/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharch_user -d kharch"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-3:
    image: postgres:18
    container_name: kharch-postgres-3
    restart: unless-stopped
    environment:
      POSTGRES_DB: kharch
      POSTGRES_USER: kharch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5435:5432"
    volumes:
      - postgres_3_data:/var/lib/postgresql
      - ./infrastructure/postgres/replication/shard-3/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/replication/shard-3/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharch_user -d kharch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # REPLICAS FOR POSTGRES-1
  # ========================================

  postgres-1-replica:
    image: postgres:18
    container_name: kharch-postgres-1-replica
    restart: unless-stopped
    environment:
      POSTGRES_DB: kharch
      POSTGRES_USER: kharch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker  # ✅ ADDED
    volumes:
      - postgres_1_replica_data:/var/lib/postgresql
    depends_on:
      postgres-1:
        condition: service_healthy
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharch_user -d kharch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # REPLICAS FOR POSTGRES-2
  # ========================================

  postgres-2-replica:
    image: postgres:18
    container_name: kharch-postgres-2-replica
    restart: unless-stopped
    environment:
      POSTGRES_DB: kharch
      POSTGRES_USER: kharch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker  # ✅ ADDED
    volumes:
      - postgres_2_replica_data:/var/lib/postgresql
    depends_on:
      postgres-2:
        condition: service_healthy
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharch_user -d kharch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # REPLICAS FOR POSTGRES-3
  # ========================================

  postgres-3-replica:
    image: postgres:18
    container_name: kharch-postgres-3-replica
    restart: unless-stopped
    environment:
      POSTGRES_DB: kharch
      POSTGRES_USER: kharch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker  # ✅ ADDED
    volumes:
      - postgres_3_replica_data:/var/lib/postgresql
    depends_on:
      postgres-3:
        condition: service_healthy
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharch_user -d kharch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # REDIS
  # ========================================

  redis:
    image: redis:8-alpine
    container_name: kharch-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # API
  # ========================================

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000

      DB_HOST: postgres-1
      DB_PORT: 5432
      DB_NAME: kharch
      DB_USER: kharch_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Shard Configuration
      SHARD_0_HOST: postgres-1
      SHARD_0_PORT: 5432

      SHARD_1_HOST: postgres-2
      SHARD_1_PORT: 5432

      SHARD_2_HOST: postgres-3
      SHARD_2_PORT: 5432

      # Replica Configuration (Read-only)
      REPLICA_0_HOST: postgres-1-replica
      REPLICA_0_PORT: 5432

      REPLICA_1_HOST: postgres-2-replica
      REPLICA_1_PORT: 5432

      REPLICA_2_HOST: postgres-3-replica
      REPLICA_2_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d

    depends_on:
      postgres-1:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
      postgres-3:
        condition: service_healthy
      postgres-1-replica:
        condition: service_healthy
      postgres-2-replica:
        condition: service_healthy
      postgres-3-replica:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================
  # NGINX
  # ========================================

  nginx:
    image: nginx:alpine
    container_name: kharch-nginx
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

# ========================================
# VOLUMES
# ========================================

volumes:
  postgres_1_data:
  postgres_2_data:
  postgres_3_data:
  postgres_1_replica_data:
  postgres_2_replica_data:
  postgres_3_replica_data:
  redis_data: