global
    log stdout format raw local0
    maxconn 100000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout queue   30s

frontend http_front
    bind *:80 backlog 65536
    maxconn 100000
    default_backend api_backend

backend api_backend
    balance roundrobin
    server api1 api1:5000 check maxconn 5000
    server api2 api2:5000 check maxconn 5000
    server api3 api3:5000 check maxconn 5000

listen stats
    bind *:1936
    stats enable
    stats uri /
    stats refresh 5s

