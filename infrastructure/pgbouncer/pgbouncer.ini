[databases]
kharch_shard0 = host=shard-1-primary port=5432 dbname=kharch
kharch_shard1 = host=shard-2-primary port=5432 dbname=kharch
kharch_shard2 = host=shard-3-primary port=5432 dbname=kharch

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = kharch_user
stats_users = kharch_user

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits

logfile = /dev/stdout
