scope: kharch-shard-2
namespace: /service/
name: shard-2-primary

restapi:
  listen: 0.0.0.0:8008
  connect_address: shard-2-primary:8008

etcd3:
  host: etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576

    postgresql:
      use_pg_rewind: true
      use_slots: true

  pg_hba:
    - host all all 0.0.0.0/0 scram-sha-256
    - host replication replicator 0.0.0.0/0 scram-sha-256

postgresql:
  listen: 0.0.0.0:5432
  connect_address: shard-2-primary:5432
  data_dir: /var/lib/postgresql/18/docker
  bin_dir: /usr/lib/postgresql/18/bin

  authentication:
    superuser:
      username: kharch_user
      password: "tanvir@7860"
    replication:
      username: replicator
      password: "tanvir@7860"

  parameters:
    wal_level: replica
    max_wal_senders: 10
    max_replication_slots: 10
    max_connections: 100

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
