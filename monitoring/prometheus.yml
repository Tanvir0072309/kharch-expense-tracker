global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:5000']
  
  - job_name: 'postgres'
    static_configs:
      - targets: ['shard-1-primary:5432', 'shard-2-primary:5432', 'shard-3-primary:5432']
  
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
